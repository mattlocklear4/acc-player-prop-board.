name: CBBD API source test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cbbd:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and inspect CBBD games
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python collector/test_cbbd.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbbd-test-results
          path: collector/output/
          if-no-files-found: warn
