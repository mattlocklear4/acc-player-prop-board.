name: ACC CBBD transfer discovery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find historical schools with CBBD
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python collector/discover_transfers.py
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-transfer-discovery
          path: data/transfer_discovery/
          if-no-files-found: warn
