name: ACC Projection Dry Run (v2.3)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *' # 8:30 AM EST / 9:30 AM EDT

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upcoming ACC schedule (read only)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/acc_schedule.py --season 2027 --horizon-hours 36
      - name: Generate projection diagnostic using latest Supabase KenPom (read only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/acc_projection_dry_run.py --schedule research/acc_schedule_dry_run.json --today-only
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-projection-dry-run
          path: |
            research/acc_schedule_dry_run.json
            research/acc_projection_dry_run.json
          if-no-files-found: warn
