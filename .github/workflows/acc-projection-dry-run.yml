name: ACC Projection Dry Run (v2.3)

on:
  workflow_dispatch:
    inputs:
      fetch_multibook_props:
        description: 'Retrieve props from DraftKings, FanDuel, Caesars, Fanatics and BetOnline for up to 20 Friday games (uses Odds API credits; manual only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/acc_*.py'
      - '!scripts/acc_grade_friday.py'
      - 'scripts/research_engine.py'
      - 'scripts/supabase_kenpom.py'
      - '.github/workflows/acc-projection-dry-run.yml'
  schedule:
    - cron: '30 13 * * *' # 8:30 AM EST / 9:30 AM EDT

concurrency:
  group: acc-projection-dry-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upcoming ACC schedule (read only)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/acc_schedule.py --season 2027 --horizon-hours 96
      - name: Generate projection diagnostic using latest Supabase KenPom (read only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/acc_projection_dry_run.py --schedule research/acc_schedule_dry_run.json
      - name: Verify matchup model arithmetic (read only)
        run: python scripts/acc_stage7_verify.py
      - name: Verify browser vs Python baseline parity (read only)
        run: python scripts/acc_stage7b_parity.py --as-of "$(date -u +%F)"
      - name: Stage 7C independent matchup and minutes arithmetic parity (read only)
        run: python scripts/acc_stage7c_verify.py
      - name: Validate live baseline with chronological out-of-sample player games (offline)
        run: python scripts/acc_validation_walkforward.py
      - name: Prepare Friday ACC projection slate (read only)
        run: python scripts/acc_friday_slate.py
      - name: Review Friday minutes, usage and availability (read only)
        run: python scripts/acc_friday_minutes_review.py
      - name: Prepare Saturday ACC projection slate (read only)
        run: python scripts/acc_saturday_slate.py
      - name: Stage 8A morning archive preview (NO DATABASE WRITES)
        run: python scripts/acc_stage8a_archive.py
      - name: Stage 8B multi-book discovery or authorized Friday odds retrieval
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.fetch_multibook_props }}' = 'true' ]; then
            python scripts/acc_stage8b_multibook.py --schedule research/acc_schedule_dry_run.json --fetch-odds --max-events 20 --min-credits-remaining 30
          else
            python scripts/acc_stage8b_multibook.py --schedule research/acc_schedule_dry_run.json
          fi
      - name: Verify DraftKings fair-odds arithmetic (NO API CALLS)
        run: python scripts/acc_value_selftest.py
      - name: Convert optional Odds API Google Sheets export (NO API CALLS)
        run: |
          if [ -f data/odds_api_sheet_export.csv ]; then
            python scripts/acc_odds_sheet_import.py --input data/odds_api_sheet_export.csv
          fi
      - name: Convert live multi-book response to prop CSV (NO ADDITIONAL API CALLS)
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.fetch_multibook_props }}' = 'true' ]; then
            python scripts/acc_multibook_preview_to_csv.py
          fi
      - name: Compare all retrieved sportsbook props against projections (NO API CALLS)
        run: |
          if [ -f data/multibook_player_props.csv ]; then
            python scripts/acc_draftkings_value.py --lines data/multibook_player_props.csv
          elif [ -f data/draftkings_player_props.csv ]; then
            python scripts/acc_draftkings_value.py --lines data/draftkings_player_props.csv
          else
            echo 'No paired sportsbook props available.'
          fi
      - name: Test minute-adjusted Friday publishing (offline)
        run: python scripts/acc_friday_scenario_selftest.py
      - name: Build public Friday projection and odds board JSON
        if: always()
        run: |
          if [ -f research/acc_friday_slate.json ]; then
            python scripts/acc_publish_friday_board.py
          fi
      - name: Publish Friday board data to GitHub Pages source
        if: success()
        run: |
          if [ -f data/friday_board.json ]; then
            cp data/friday_board.json /tmp/acc-friday-board.json
            python - <<'PY'
            import json, datetime, pathlib
            d=json.loads(pathlib.Path('data/friday_board.json').read_text())
            day=d.get('date_eastern','')
            games=d.get('games') or []
            try:
                friday=datetime.date.fromisoformat(day).weekday()==4
                generated=datetime.datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
                before_all=all(g.get('tipoff_utc') and generated < datetime.datetime.fromisoformat(g['tipoff_utc'].replace('Z','+00:00')) for g in games)
            except (ValueError,KeyError,TypeError):
                friday=before_all=False
            if friday and games and before_all:
                pathlib.Path('/tmp/acc-friday-archive.json').write_text(json.dumps(d,indent=2)+'\n')
                pathlib.Path('/tmp/acc-friday-archive-date').write_text(day)
            PY
            if [ -f data/validation_summary.json ]; then cp data/validation_summary.json /tmp/acc-validation-summary.json; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for attempt in 1 2 3; do
              git fetch origin main
              git checkout -B friday-publish origin/main
              cp /tmp/acc-friday-board.json data/friday_board.json
              if [ -f /tmp/acc-friday-archive-date ]; then
                archive_path="data/archives/friday_$(cat /tmp/acc-friday-archive-date).json"
                mkdir -p data/archives
                if [ ! -f "$archive_path" ]; then cp /tmp/acc-friday-archive.json "$archive_path"; fi
              fi
              if [ -f /tmp/acc-validation-summary.json ]; then cp /tmp/acc-validation-summary.json data/validation_summary.json; fi
              git add data/friday_board.json data/validation_summary.json data/archives/
              if git diff --cached --quiet; then
                echo "Friday board already up to date"
                break
              fi
              git commit -m 'Update Friday ACC projection and odds board [skip ci]'
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Board publish push failed after 3 attempts"
                exit 1
              fi
              sleep 3
            done
          fi
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-projection-dry-run
          path: |
            research/acc_schedule_dry_run.json
            research/acc_projection_dry_run.json
            research/acc_saturday_slate.json
            research/acc_friday_slate.json
            research/acc_friday_minutes_review.json
            research/acc_stage7_verification.json
            research/acc_stage7b_parity.json
            research/acc_stage7c_verification.json
            research/acc_stage8a_archive_preview.json
            research/acc_stage8b_multibook_preview.json
            research/acc_draftkings_value_preview.json
            data/friday_board.json
            data/validation_summary.json
          if-no-files-found: warn
