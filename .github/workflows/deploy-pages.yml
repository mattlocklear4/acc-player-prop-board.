name: Deploy ACC Board to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily.html'
      - 'daily-tab.js'
      - 'performance.js'
      - 'pregame-edges.js'
      - 'data/daily_board.json'
      - 'data/daily_grading.json'
      - 'data/daily_odds_evaluation.json'
      - 'data/pregame_edge_grading.json'
      - 'data/pregame_pending.json'
      - 'data/pipeline_health.json'
      - 'data/archives/daily/**'
      - 'data/odds_snapshots/**'
      - 'style.css'
      - 'app.js'
      - 'friday-board.js'
      - 'data.js'
      - 'data/friday_board.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static entrypoint
        run: |
          test -s index.html
          test -s app.js
          test -s style.css
      - uses: actions/configure-pages@v5
      - name: Package static site for Pages
        run: |
          mkdir -p /tmp/acc-pages
          tar --dereference --hard-dereference --directory=. -cvf /tmp/acc-pages/artifact.tar --exclude=.git --exclude=.github .
      - name: Upload named GitHub Pages artifact
        id: pages_artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/acc-pages/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Wait for uploaded artifact metadata to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          # The Pages metadata service can lag a successful artifact upload.
          sleep 15
          for attempt in {1..9}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" > /tmp/acc-pages/artifacts.json; then
              if jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '[.artifacts[] | select(.name == $name and (.id|tostring) == $id and .expired == false)] | length == 1' /tmp/acc-pages/artifacts.json >/dev/null; then
                echo "Verified deployment artifact $ARTIFACT_NAME ($ARTIFACT_ID)"
                sleep 10
                exit 0
              fi
            fi
            echo "Artifact metadata not ready (check $attempt of 9)"
            sleep 10
          done
          echo "::error::Uploaded artifact metadata did not become available; stopping before Pages deployment."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
