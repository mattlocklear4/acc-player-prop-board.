name: Deploy ACC Board to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily.html'
      - 'daily-tab.js'
      - 'data/daily_board.json'
      - 'data/daily_grading.json'
      - 'data/daily_odds_evaluation.json'
      - 'data/archives/daily/**'
      - 'data/odds_snapshots/**'
      - 'style.css'
      - 'app.js'
      - 'friday-board.js'
      - 'data.js'
      - 'data/friday_board.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static entrypoint
        run: |
          test -s index.html
          test -s app.js
          test -s style.css
      - uses: actions/configure-pages@v5
      - name: Package static site for Pages
        run: |
          mkdir -p /tmp/acc-pages
          tar --dereference --hard-dereference --directory=. -cvf /tmp/acc-pages/artifact.tar --exclude=.git --exclude=.github .
      - name: Upload named GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: /tmp/acc-pages/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
