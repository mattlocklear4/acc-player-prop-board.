name: ACC Vegas odds snapshots
on:
  workflow_dispatch:
  schedule:
    # 15:10 and 22:10 UTC daily. UTC schedule shifts relative to Eastern daylight time.
    - cron: '10 15,22 * * *'
permissions:
  contents: write
concurrency:
  group: acc-vegas-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect upcoming ACC game odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py
      - name: Save timestamped odds to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/acc_odds.json data/odds_history/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive ACC pregame Vegas odds'
            git push
          fi
