name: ACC model evaluation tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/acc_model_comparison.py'
      - 'scripts/acc_grade_pregame.py'
      - 'tests/test_acc_pregame_grade.py'
      - 'performance.js'
      - 'pregame-edges.js'
      - 'scripts/acc_capture_pregame.cjs'
      - 'scripts/acc_intraday_odds.py'
      - 'scripts/acc_daily_odds_snapshot.py'
      - 'tests/test_acc_intraday_odds.py'
      - 'tests/test_acc_pregame_archive.cjs'
      - '.github/workflows/acc-daily-odds.yml'
      - '.github/workflows/acc-model-evaluation-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prospective grading and common-cohort matching
        run: python -m unittest discover -s tests -p 'test_acc_pregame_grade.py' -v
      - name: Test budget-aware collection and immutable archives
        run: |
          python -m unittest discover -s tests -p 'test_acc_intraday_odds.py' -v
          node tests/test_acc_pregame_archive.cjs
          node tests/test_pregame_edges.cjs
      - name: Verify frontend syntax
        run: node --check performance.js
