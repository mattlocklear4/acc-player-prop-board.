name: Daily ACC sportsbook snapshot (credit capped)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15,16 * * *'
permissions:
  contents: write
concurrency:
  group: acc-daily-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate near 11 AM daily in America/New_York (allow GitHub schedule jitter)
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          from zoneinfo import ZoneInfo
          n=datetime.datetime.now(ZoneInfo('America/New_York'))
          # GitHub cron can start a few minutes before the intended hour.
          # The snapshot script refuses a second paid request once today's file exists.
          in_window=(n.hour==10 and n.minute>=45) or (11<=n.hour<13)
          print('run='+str(in_window).lower())
          print('date='+n.date().isoformat())
          PY
      - name: Collect today schedule and one quota-capped odds snapshot
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/acc_daily_odds_snapshot.py
      - name: Commit immutable odds snapshot
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/odds_snapshots ]; then
            cp -r data/odds_snapshots /tmp/acc-odds-snapshots
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard HEAD
              git checkout -B daily-odds-publish origin/main
              mkdir -p data/odds_snapshots
              # Preserve all previously committed snapshots without overwriting them.
              for source in /tmp/acc-odds-snapshots/*.json; do
                [ -f "$source" ] || continue
                target="data/odds_snapshots/$(basename "$source")"
                if [ ! -e "$target" ]; then cp "$source" "$target"; fi
              done
              git add data/odds_snapshots/
              if git diff --cached --quiet; then break; fi
              git commit -m 'Archive daily ACC sportsbook lines'
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-daily-odds
          path: |
            data/odds_snapshots/
            research/acc_stage8b_multibook_preview.json
