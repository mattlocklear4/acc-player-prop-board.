name: Daily ACC sportsbook snapshot (credit capped)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: acc-daily-odds
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Eastern collection window
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,os
          from zoneinfo import ZoneInfo
          n=datetime.datetime.now(ZoneInfo('America/New_York'))
          allowed=n.hour>=11 or os.environ.get('MANUAL','').lower()=='true'
          print('run='+str(allowed).lower())
          print('date='+n.date().isoformat())
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Offline collection and archive safety checks
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_acc_intraday_odds.py'
          node tests/test_acc_pregame_archive.cjs
      - name: Collect initial odds or eligible intraday refresh
        if: steps.gate.outputs.run == 'true'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TODAY: ${{ steps.gate.outputs.date }}
        run: |
          if [ -f "data/odds_snapshots/$TODAY.json" ]; then
            python scripts/acc_intraday_odds.py
          else
            python scripts/acc_daily_odds_snapshot.py
          fi
      - name: Immediately capture new pregame quotes using saved projections
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain -- data/odds_snapshots/)" ]; then
            node scripts/acc_capture_pregame.cjs
          fi
      - name: Publish immutable morning odds, intraday observations and pre-tip captures
        if: always() && steps.gate.outputs.run == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.date }}
        run: |
          if [ -z "$(git status --porcelain -- data/odds_snapshots/ data/archives/pregame/)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp=$(mktemp -d)
          mkdir -p "$tmp/archives" "$tmp/intraday"
          if [ -f "data/odds_snapshots/$TODAY.json" ]; then cp "data/odds_snapshots/$TODAY.json" "$tmp/"; fi
          if [ -f "data/odds_snapshots/intraday/$TODAY.json" ]; then cp "data/odds_snapshots/intraday/$TODAY.json" "$tmp/intraday/"; fi
          if [ -d "data/archives/pregame/$TODAY" ]; then cp -r "data/archives/pregame/$TODAY" "$tmp/archives/"; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard HEAD
            # All new local observations were copied to the temporary backup above.
            git clean -fd -- data/odds_snapshots/ data/archives/pregame/
            git checkout -B daily-odds-publish origin/main
            mkdir -p data/odds_snapshots/intraday data/archives/pregame
            if [ -f "$tmp/$TODAY.json" ] && [ ! -e "data/odds_snapshots/$TODAY.json" ]; then cp "$tmp/$TODAY.json" "data/odds_snapshots/$TODAY.json"; fi
            if [ -f "$tmp/intraday/$TODAY.json" ]; then cp "$tmp/intraday/$TODAY.json" "data/odds_snapshots/intraday/$TODAY.json"; fi
            if [ -d "$tmp/archives/$TODAY" ]; then cp -an "$tmp/archives/$TODAY" data/archives/pregame/; fi
            git add data/odds_snapshots/ data/archives/pregame/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Archive ACC intraday sportsbook observations and exact pregame quotes'
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: acc-daily-odds
          path: |
            data/odds_snapshots/
            research/acc_stage8b_multibook_preview.json
