name: ACC CBBD transfer history (manual batches)

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Starting team-season job (0 for first batch, then 12, 24, etc.)'
        required: true
        default: '0'
      limit:
        description: 'Maximum API requests this run (1-20)'
        required: true
        default: '12'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect historical games for previous schools
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          JOB_OFFSET: ${{ inputs.offset }}
          JOB_LIMIT: ${{ inputs.limit }}
        run: |
          python collector/collect_transfer_history.py --offset "$JOB_OFFSET" --limit "$JOB_LIMIT"
      - name: Upload historical game logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-transfer-history-${{ inputs.offset }}
          path: data/cbbd/transfer_history/
          if-no-files-found: warn
