name: ACC advanced stats source test
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
permissions:
  contents: write
jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install collector packages
        run: |
          Rscript -e 'install.packages(c("hoopR", "jsonlite"), repos="https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("hoopR", quietly=TRUE))'
      - name: Collect and test 2027 game data
        run:  
          mkdir -p collector/output
          Rscript -e '
            players <- hoopR::torvik_player_stats(year = 2027)
            cat("Player records:", nrow(players), "\n")
            if (nrow(players) == 0) stop("No player data returned")
            print(head(players[, intersect(c("player_name", "team", "conf", "games", "usage", "o_rtg"), names(players))], 10))
            write.csv(players, "collector/output/torvik_players_2027.csv", row.names = FALSE)
          '
      - name: Archive diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-source-test
          path: |
            collector/status.json
            collector/output/*.csv
          if-no-files-found: warn
      - name: Publish public diagnostic status and returned data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector/status.json collector/output/
          if ! git diff --cached --quiet; then
            git commit -m 'Update ACC source diagnostic [skip ci]'
            git push
          fi
