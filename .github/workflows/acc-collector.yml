name: ACC advanced stats source test
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
permissions:
  contents: write
jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install collector packages
        run: |
          Rscript -e 'install.packages(c("jsonlite", "toRvik"), repos="https://cloud.r-project.org")'
      - name: Collect and test 2027 game data
        run: Rscript collect.R
      - name: Archive diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-source-test
          path: |
            collector/status.json
            collector/output/*.csv
          if-no-files-found: warn
      - name: Publish public diagnostic status and returned data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector/status.json collector/output/
          if ! git diff --cached --quiet; then
            git commit -m 'Update ACC source diagnostic [skip ci]'
            git push
          fi
