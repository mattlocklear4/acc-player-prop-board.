name: ACC ESPN daily boxscore fallback
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: acc-espn-boxscores
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect recent final ACC ESPN box scores
        run: python collector/collect_espn.py
      - name: Publish player logs and freshness status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -r data/espn /tmp/acc-espn-results
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard HEAD
            git checkout -B espn-publish origin/main
            mkdir -p data/espn
            cp /tmp/acc-espn-results/* data/espn/
            git add data/espn/
            if git diff --cached --quiet; then break; fi
            git commit -m 'Update daily ACC ESPN box scores [skip ci]'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Grade archived projections after ESPN finals are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run acc-daily-grading.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acc-espn-boxscores
          path: data/espn/
