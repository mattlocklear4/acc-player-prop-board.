name: ACC CBBD nightly team statistics
# The combined private collector refreshes both datasets each morning.
# Retain a manual workflow for a standalone team-only refresh.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acc-cbbd-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh team statistics privately
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collector/private_cbbd_cache.py refresh --scope teams
