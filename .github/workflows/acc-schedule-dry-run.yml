name: ACC Schedule Dry Run (v2.3)

on:
  workflow_dispatch:
  schedule:
    - cron: '10 12 * * *'
    - cron: '10 18 * * *'
    - cron: '10 23 * * *'

permissions:
  contents: read

concurrency:
  group: acc-schedule-dry-run
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check upcoming ACC games (read-only)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python scripts/acc_schedule.py --season 2027 --horizon-hours 72
      - name: Save diagnostic schedule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-schedule-dry-run
          path: research/acc_schedule_dry_run.json
          if-no-files-found: warn
