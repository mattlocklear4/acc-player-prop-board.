name: ACC CBBD transfer history (grouped collection)

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Starting job index (24, 64, or 104)'
        required: true
        default: '24'
        type: choice
        options:
          - '24'
          - '64'
          - '104'
      count:
        description: 'Number of team-season jobs (40 for offsets 24/64; 32 for 104)'
        required: true
        default: '40'
        type: choice
        options:
          - '40'
          - '32'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and combine previous-school game logs
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          JOB_OFFSET: ${{ inputs.offset }}
          JOB_COUNT: ${{ inputs.count }}
        run: |
          python collector/run_transfer_history_group.py --offset "$JOB_OFFSET" --count "$JOB_COUNT"
      - name: Upload combined game logs and per-batch summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-transfer-group-${{ inputs.offset }}
          path: data/cbbd/transfer_history/
          if-no-files-found: warn
