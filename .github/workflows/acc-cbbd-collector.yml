name: ACC CBBD nightly collector
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/private_cbbd_cache.py'
      - 'collector/collect_team_stats.py'
      - '.github/workflows/acc-cbbd-collector.yml'
  schedule:
    - cron: '20 11 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: acc-cbbd-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CBBD entitlement and privately refresh current season
        id: refresh
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The manual and scheduled refreshes always collect both datasets.
          # On this push, a verified player cache from the same day can be reused.
          python collector/private_cbbd_cache.py refresh --reuse-today-players-if-push
      - name: Publish aggregate collection status only
        if: always()
        run: |
          test -f data/cbbd/acc_private_refresh_status.json || exit 0
          cp data/cbbd/acc_private_refresh_status.json /tmp/acc-private-refresh-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard HEAD
            git checkout -B cbbd-private-publish origin/main
            cp /tmp/acc-private-refresh-status.json data/cbbd/acc_private_refresh_status.json
            git add data/cbbd/acc_private_refresh_status.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish CBBD private refresh status'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Rebuild remaining pregame projections from private cache
        if: steps.refresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run acc-daily-projections.yml --ref main
